queue_rules:
  - name: downstream patches
    queue_conditions:
      - "#approved-reviews-by >= 1"
      - "base ~= ^(main-(delight|xpla|maroo)|release/v0[.][0-9]+[.]x-(delight|xpla|maroo))$"
      - "label = automerge"
      - "-label = kind/upstream-sync"
    merge_conditions:
      - "#approved-reviews-by >= 1"
    merge_method: squash
    commit_message_format:
      title: pr-title
      body: pr-body

  - name: upstream and layer sync
    queue_conditions:
      - "#approved-reviews-by >= 1"
      - "base ~= ^(main-(delight|xpla|maroo)|release/v0[.][0-9]+[.]x-(delight|xpla|maroo))$"
      - "label = automerge"
      - "label = kind/upstream-sync"
    merge_conditions:
      - "#approved-reviews-by >= 1"
    merge_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body

pull_request_rules:
  - name: backport shared patches to v0.6.x
    conditions:
      - "base = main-delight"
      - "label = backport/0.6.x"
      - "-label = kind/upstream-sync"
    actions:
      backport:
        branches:
          - release/v0.6.x-delight
        labels:
          - automerge

  - name: backport XPLA patches to v0.6.x
    conditions:
      - "base = main-xpla"
      - "label = backport/0.6.x"
      - "-label = kind/upstream-sync"
    actions:
      backport:
        branches:
          - release/v0.6.x-xpla
        labels:
          - automerge
