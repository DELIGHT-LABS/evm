name: DELIGHT / System Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main-delight
      - main-xpla
      - main-maroo
      - "release/v0.*.x-delight"
      - "release/v0.*.x-xpla"
      - "release/v0.*.x-maroo"
    paths:
      - ".github/workflows/delight-system-test.yml"
      - "**/*.go"
      - "**/*.sol"
      - "go.mod"
      - "go.sum"
      - "evmd/go.mod"
      - "evmd/go.sum"
      - "tests/systemtests/**"
      - "scripts/**"
      - "Makefile"
  merge_group:
  push:
    branches:
      - main-delight
      - main-xpla
      - main-maroo
      - "release/v0.*.x-delight"
      - "release/v0.*.x-xpla"
      - "release/v0.*.x-maroo"
    paths:
      - ".github/workflows/delight-system-test.yml"
      - "**/*.go"
      - "**/*.sol"
      - "go.mod"
      - "go.sum"
      - "evmd/go.mod"
      - "evmd/go.sum"
      - "tests/systemtests/**"
      - "scripts/**"
      - "Makefile"

concurrency:
  group: delight-system-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  system:
    name: System
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            evmd/go.sum

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run system tests
        run: make test-system
